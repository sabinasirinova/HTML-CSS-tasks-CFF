<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <title>AlgoBank</title>
    <link rel='stylesheet' href='style.css'>
    <script src='script.js'></script>
</head>
<body>
    <div class='container'>
        <div class='left'>
            <div class='card-wrapper'>
                <h1>Kart məlumatları</h1>
                <div class='card'>
                    <img src='/uploads/2024/07/card-bg_0_1719826633.png'>
                    <input class='card-number' type='number' placeholder='11 22 33'>
                    <div class='card-holder-group'>
                        <input class='card-holder-name' type='text' placeholder='Name'>
                        <input class='card-holder-surname' type='text' placeholder='Surname'>
                    </div>
                    <div class='card-expire-group'>
                        <input class='card-expire-month' type='number' placeholder='10'>
                        <input class='card-expire-year' type='number' placeholder='27'>
                    </div>
                </div>
            </div>
            <div class='user-wrapper'>
                <h1>İstifadəçinin məlumatları</h1>
                <div class='user-info-group'>
                    <p>Telefon nömrəsi</p>
                    <input class='card-holder-phone' type='text'>
                    <p>Elektron poçt</p>
                    <input class='card-holder-email' type='email'>
                    <p>Cins</p>
                    <select class='card-holder-gender'>
                        <option value='Q'>Qadın</option>
                        <option value='K'>Kişi</option>
                    </select>
                    <div class='create-card-btn'>Kart yaratmaq<i style='margin-left: 1em' class='fa-solid fa-arrow-right'></i></div>
                </div>
            </div>
        </div>
        
        <div class='right'>
            <div class='get-card-info-group'>
                <input type='number'>
                <div class='get-card-info-btn'>Əldə etmək</div>
            </div>
            <div class='cards'>
              

            </div>
        </div>
    </div>
</body>
</html>
